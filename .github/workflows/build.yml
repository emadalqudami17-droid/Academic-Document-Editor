name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            m4 \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            ccache

      - name: Check environment
        run: |
          python --version
          pip --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Buildozer and compatible tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-p4a-2024.01.21-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-p4a-2024.01.21-

      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      - name: Check APK
        run: |
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academicword-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
